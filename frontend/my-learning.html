<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Learning - LMS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .back-btn {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .page-title {
            font-size: 30px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .course-container {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 25px;
        }

        .course-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .course-card h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .course-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;

            font-weight: bold;
            margin-bottom: 7px;
        }

        .progress-bg {
            width: 100%;
            height: 13px;

            background: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 18px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background: #16a34a;

            transition: width 0.3s;
        }

        .continue-btn {
            width: 100%;

            padding: 11px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .continue-btn:hover {
            background: #1d4ed8;
        }

        .empty {
            background: white;
            padding: 50px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #666;
            margin-bottom: 20px;
        }

        .browse-btn {
            background: #2563eb;
            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        footer {
            margin-top: 50px;

            background: #172554;

            color: white;

            text-align: center;

            padding: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>🎓 LMS Portal</h1>

    <button
        class="back-btn"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</header>



<div class="container">


    <h1 class="page-title">

        📚 My Learning

    </h1>


    <p class="subtitle">

        Continue your learning journey.

    </p>


    <div
        id="courseContainer"
        class="course-container">

    </div>


</div>



<footer>

    © 2026 LMS Portal |
    Learning Management System

</footer>



<script>


/* =================================
   GET ENROLLED COURSES
================================= */

function getEnrolledCourses() {

    return JSON.parse(
        localStorage.getItem(
            "enrolledCourses"
        )
    ) || [];

}



/* =================================
   GET COURSE PROGRESS
================================= */

function getProgress(courseId) {

    const topicCount = {

        3: 12,
        6: 12,
        7: 12,
        8: 12,
        9: 12,
        10: 12,
        11: 15,
        12: 12,
        13: 12,
        14: 12,
        15: 12

    };


    const total =
        topicCount[courseId] || 12;


    let completed = 0;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const key =
            "course_"
            + courseId
            + "_topic_"
            + i;


        if (
            localStorage.getItem(key)
            === "completed"
        ) {

            completed++;

        }

    }


    return Math.round(
        (completed / total) * 100
    );

}



/* =================================
   LOAD COURSES
================================= */

function loadMyLearning() {

    const container =
        document.getElementById(
            "courseContainer"
        );


    const courses =
        getEnrolledCourses();


    container.innerHTML = "";


    if (courses.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    📚 No Courses Yet
                </h2>

                <p>
                    You haven't enrolled in any courses.
                </p>

                <button
                    class="browse-btn"
                    onclick="goDashboard()">

                    Browse Courses

                </button>

            </div>

        `;

        return;

    }


    courses.forEach(
        function(course) {


            const progress =
                getProgress(course.id);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "course-card";


            card.innerHTML = `

                <h2>
                    📘 ${course.title}
                </h2>

                <p>
                    Keep learning and improve
                    your programming skills.
                </p>

                <div class="progress-label">

                    <span>
                        Progress
                    </span>

                    <span>
                        ${progress}%
                    </span>

                </div>


                <div class="progress-bg">

                    <div
                        class="progress-bar"
                        style="width:${progress}%">

                    </div>

                </div>


                <button
                    class="continue-btn"
                    onclick="continueCourse(${course.id})">

                    ${
                        progress === 100
                        ? "🎉 Completed"
                        : "▶ Continue Learning"
                    }

                </button>

            `;


            container.appendChild(
                card
            );

        }
    );

}



/* =================================
   CONTINUE COURSE
================================= */

function continueCourse(id) {

    window.location.href =
        "course.html?id=" + id;

}



/* =================================
   DASHBOARD
================================= */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}



/* =================================
   START
================================= */

loadMyLearning();

</script>


</body>

</html>
