<body>


<header>

    <h1>
        🎓 LMS Quiz
    </h1>

    <button
        class="back-btn"
        onclick="goBack()">

        ← Course

    </button>

</header>


<div class="container">


    <div class="title-card">

        <h2>
            📝 Java Programming Quiz
        </h2>

        <p>
            Answer all questions and submit
            to see your score.
        </p>

    </div>


    <div id="quizContainer">

        <div class="loading">

            Loading quiz questions...

        </div>

    </div>


    <button
        id="submitButton"
        class="submit-btn"
        onclick="submitQuiz()"
        style="display:none;">

        📝 Submit Quiz

    </button>


    <div
        id="result"
        class="result">

        <h2>
            🏆 Quiz Result
        </h2>

        <div id="score">
            0 / 0
        </div>

        <div id="resultMessage">
        </div>

        <button
            class="dashboard-btn"
            onclick="goDashboard()">

            Go to Dashboard

        </button>

    </div>


</div>


<script>


    // =====================================
    // GET COURSE ID FROM URL
    // =====================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const courseId =
        params.get("id");


    // =====================================
    // QUIZ API
    // =====================================

    const API_URL =
        "http://localhost:8080/api/quiz/course/"
        + courseId;


    let questions = [];


    // =====================================
    // LOAD QUIZ
    // =====================================

    async function loadQuiz() {

        const container =
            document.getElementById(
                "quizContainer"
            );


        try {


            if (!courseId) {

                throw new Error(
                    "Course ID missing"
                );

            }


            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Quiz API failed"
                );

            }


            questions =
                await response.json();


            if (
                !questions ||
                questions.length === 0
            ) {

                container.innerHTML = `

                    <div class="error">

                        ❌ No quiz questions
                        available.

                    </div>

                `;

                return;

            }


            displayQuestions();


            document
                .getElementById(
                    "submitButton"
                )
                .style.display =
                "block";

        }


        catch (error) {

            console.error(error);


            container.innerHTML = `

                <div class="error">

                    ❌ Unable to load quiz.

                    <br><br>

                    Please make sure
                    Spring Boot is running.

                </div>

            `;

        }

    }


    // =====================================
    // DISPLAY QUESTIONS
    // =====================================

    function displayQuestions() {

        const container =
            document.getElementById(
                "quizContainer"
            );


        container.innerHTML = "";


        questions.forEach(
            (question, index) => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "question-card";


                card.innerHTML = `

                    <h3>

                        ${index + 1}.
                        ${question.question}

                    </h3>


                    <label class="option">

                        <input
                            type="radio"
                            name="question-${question.id}"
                            value="A">

                        A. ${question.optionA}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question-${question.id}"
                            value="B">

                        B. ${question.optionB}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question-${question.id}"
                            value="C">

                        C. ${question.optionC}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question-${question.id}"
                            value="D">

                        D. ${question.optionD}

                    </label>

                `;


                container.appendChild(card);

            }
        );

    }


    // =====================================
    // SUBMIT QUIZ
    // =====================================

    function submitQuiz() {


        let score = 0;


        questions.forEach(
            question => {


                const selected =
                    document.querySelector(
                        `input[name="question-${question.id}"]:checked`
                    );


                if (
                    selected &&
                    selected.value ===
                    question.correctAnswer
                ) {

                    score++;

                }

            }
        );


        const total =
            questions.length;


        const percentage =
            total > 0
                ? Math.round(
                    (score / total) * 100
                )
                : 0;


        // =====================================
        // SAVE SCORE
        // =====================================

        localStorage.setItem(

            "quizScore_" + courseId,

            JSON.stringify({

                score: score,

                total: total,

                percentage: percentage,

                date:
                    new Date()
                    .toLocaleDateString()

            })

        );


        // =====================================
        // SHOW SCORE
        // =====================================

        document
            .getElementById("score")
            .innerText =
            score + " / " + total;


        const message =
            document.getElementById(
                "resultMessage"
            );


        if (percentage >= 50) {

            message.innerText =
                "Great job! You scored "
                + percentage
                + "%.";

            message.className =
                "pass";

        }

        else {

            message.innerText =
                "Keep practicing! You scored "
                + percentage
                + "%.";

            message.className =
                "fail";

        }


        // Show result

        document
            .getElementById("result")
            .style.display =
            "block";


        // Hide submit button

        document
            .getElementById("submitButton")
            .style.display =
            "none";


        // Scroll

        window.scrollTo({

            top:
                document.body.scrollHeight,

            behavior:
                "smooth"

        });

    }


    // =====================================
    // BACK TO COURSE
    // =====================================

    function goBack() {

        window.location.href =
            "course.html?id=" +
            courseId;

    }


    // =====================================
    // DASHBOARD
    // =====================================

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    // =====================================
    // START
    // =====================================

    loadQuiz();


</script>


</body>

</html>
