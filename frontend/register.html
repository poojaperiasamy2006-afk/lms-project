<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LMS Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 60px;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 LMS Portal</h1>
</header>

<div class="container">

    <h2>📝 Create Account</h2>

    <form id="registerForm">

        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        if (password !== confirmPassword) {

            message.innerText =
                "❌ Passwords do not match.";

            message.style.color = "red";

            return;
        }

        // Save user details temporarily
        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userPassword", password);

        message.innerText =
            "✅ Registration successful!";

        message.style.color = "green";

        setTimeout(function() {

            window.location.href = "login.html";

        }, 1000);

    });

</script>

</body>
</html>
