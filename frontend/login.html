<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LMS Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 60px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>🎓 LMS Portal</h1>

</header>


<div class="container">

    <h2>🔐 Login</h2>


    <form id="loginForm">


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <div
        class="message"
        id="message">
    </div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


</div>


<script>


    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {


            event.preventDefault();


            const email =
                document.getElementById("email").value;


            const password =
                document.getElementById("password").value;


            // Get registered user details

            const savedEmail =
                localStorage.getItem("userEmail");


            const savedPassword =
                localStorage.getItem("userPassword");


            const message =
                document.getElementById("message");


            // Check login details

            if (
                email === savedEmail &&
                password === savedPassword
            ) {


                message.innerText =
                    "✅ Login successful!";


                message.style.color =
                    "green";


                // Go to dashboard

                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            }


            else {


                message.innerText =
                    "❌ Invalid email or password.";


                message.style.color =
                    "red";


            }


        });


</script>


</body>

</html>
